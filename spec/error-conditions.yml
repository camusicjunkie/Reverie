# The closed, authoritative list of every <phase>.<condition> diagnostic id
# Reverie's compiler can raise.
#
# Source of truth: the design-spec tracker (github.com/camusicjunkie/Reverie
# issues #2-#28), walked in order to its FINAL settled form -- not a
# transcription of every intermediate rename. Three ids here
# (configure.malformed_reverie_yml, configure.malformed_chain_entry,
# configure.malformed_defaults) have no tracker equivalent: they were
# necessary additions the #30 scaffold made that the design tickets never
# named, in the same spirit as the "closed-list gaps" sweeps (#25, #27).
#
# `implemented: true` means the condition has real code raising it and a
# fixture case exercising it today; the mechanical coverage check in
# tests/conftest.py (assert_diagnostic / pytest_sessionfinish) only holds
# implemented ids to the "every registry id needs a fixture" rule, so the
# many conditions later tickets (#32-#38) will implement don't fail today's
# build.
#
# `fields` lists every key besides `id`/`phase` the diagnostic carries.
# Prose docs are generated from this file: see scripts/generate_spec_docs.py
# and the checked-in docs/spec-registry.md it produces.

