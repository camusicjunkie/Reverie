[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverie"
version = "0.1.0"
description = "A hierarchical configuration data layer for Ansible."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
reverie = "reverie.cli:main"

[tool.setuptools.packages.find]
include = ["reverie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
